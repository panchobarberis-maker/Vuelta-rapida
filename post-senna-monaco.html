<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Senna Mónaco — Vuelta Rápida Club</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Barlow Condensed', sans-serif;
    }

    /* 4:5 */
    .card {
      position: relative;
      width: 864px;
      height: 1080px;
      overflow: hidden;
      background: #0d0d0d;
    }

    /* FOTO FULL BG */
    .bg-photo {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .bg-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Líneas diagonales VR */
    .overlay-lines {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: repeating-linear-gradient(
        -55deg,
        transparent,
        transparent 48px,
        rgba(200,0,0,0.07) 48px,
        rgba(200,0,0,0.07) 50px
      );
    }

    /* Degradé estándar VR — siempre este */
    .overlay-gradient {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.08)  0%,
        rgba(0,0,0,0.05) 25%,
        rgba(0,0,0,0.30) 48%,
        rgba(0,0,0,0.78) 62%,
        rgba(0,0,0,0.93) 75%,
        rgba(0,0,0,0.97) 100%
      );
    }

    /* CONTENIDO — padding 15% = margen 70% del ancho útil */
    .content {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      padding: 48px 130px 48px 48px;
    }

    .spacer { flex: 1; }

    /* Número decorativo */
    .big-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 220px;
      line-height: 0.85;
      color: rgba(200,0,0,0.22);
      margin-left: -6px;
      margin-bottom: -16px;
      letter-spacing: -6px;
      pointer-events: none;
    }

    .pre-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e10600;
      margin-bottom: 6px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 110px;
      line-height: 0.88;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 4px;
      white-space: nowrap;
      text-shadow: 2px 2px 12px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.7);
    }
    h1 span { color: #e10600; }

    .h1-sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 60px;
      color: rgba(255,255,255,0.85);
      line-height: 1;
      margin-bottom: 24px;
      white-space: nowrap;
      text-shadow: 2px 2px 12px rgba(0,0,0,0.9);
    }

    .red-bar {
      width: 60px;
      height: 4px;
      background: #e10600;
      margin-bottom: 22px;
    }

    .years {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      margin-bottom: 20px;
    }
    .year-tag {
      background: rgba(225,6,0,0.15);
      border: 1px solid rgba(225,6,0,0.55);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      padding: 3px 12px;
      border-radius: 2px;
    }

    .body-text {
      font-family: 'Barlow', sans-serif;
      font-size: 16px;
      color: rgba(255,255,255,0.85);
      line-height: 1.55;
      max-width: 520px;
      margin-bottom: 32px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    .body-text em {
      color: #fff;
      font-style: italic;
      font-weight: 600;
    }

    /* Logo abajo a la derecha — siempre */
    .logo {
      position: absolute;
      bottom: 36px;
      right: 40px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon { width: 32px; height: 32px; }
    .logo-text { display: flex; flex-direction: column; line-height: 1; text-align: right; }
    .logo-text .main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      color: #fff;
      letter-spacing: 2px;
    }
    .logo-text .sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: rgba(255,255,255,0.9);
      letter-spacing: 6px;
    }

    .logo-store {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      color: #e10600;
      letter-spacing: 1.5px;
      text-align: right;
      margin-top: 4px;
    }

    .gp-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
