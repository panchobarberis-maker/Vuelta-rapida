name: Deploy Feed Preview to Vercel

on:
  push:
    branches:
      - claude/adoring-archimedes-18e5dm
      - main
    paths:
      - 'feed-preview/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        working-directory: feed-preview
        run: |
          URL=$(vercel --yes --token ${{ secrets.VERCEL_TOKEN }} --prod 2>&1 | grep -E 'https://' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Comment URL
        if: steps.deploy.outputs.url != ''
        run: echo "Feed preview live at ${{ steps.deploy.outputs.url }}"
