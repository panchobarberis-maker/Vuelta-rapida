name: Monitor @autosport

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos
  workflow_dispatch:          # trigger manual desde GitHub

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Check for new tweets and generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python3 monitor_twitter.py

      - name: Commit and push if hay contenido nuevo
        run: |
          git config user.name  "vuelta-rapida-bot"
          git config user.email "bot@vueltarapidaclub.com"
          git add -A
          git diff --staged --quiet || git commit -m "🏎 Auto: post desde @autosport"
          git push

      - name: Publicar en Instagram y Facebook
        if: ${{ hashFiles('.pending_post.json') != '' }}
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
        run: python3 post_meta.py
