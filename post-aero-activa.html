<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Sin aerodinámica activa — Mónaco 2026</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#111; display:flex; align-items:center; justify-content:center; min-height:100vh; }

    .card {
      position:relative; width:864px; height:1080px;
      overflow:hidden; background:#0d0d0d;
    }

    .bg-photo { position:absolute; inset:0; z-index:0; }
    .bg-photo img { width:100%; height:100%; object-fit:cover; object-position:center bottom; display:block; }

    .overlay-lines {
      position:absolute; inset:0; z-index:1;
      background: repeating-linear-gradient(-55deg, transparent, transparent 48px, rgba(200,0,0,0.07) 48px, rgba(200,0,0,0.07) 50px);
    }

    .overlay-gradient {
      position:absolute; inset:0; z-index:2;
      background: linear-gradient(to bottom,
        rgba(0,0,0,0.0)  0%,
        rgba(0,0,0,0.0) 40%,
        rgba(0,0,0,0.08) 55%,
        rgba(0,0,0,0.50) 70%,
        rgba(0,0,0,0.75) 82%,
        rgba(0,0,0,0.88) 100%
      );
    }

    .content {
      position:absolute; inset:0; z-index:3;
      display:flex; flex-direction:column;
      padding:48px 48px 100px 48px;
    }

    .pre-label {
      font-family:'Bebas Neue',sans-serif;
      font-size:22px; font-weight:900; letter-spacing:3px;
      text-transform:uppercase; color:#fff;
      text-shadow: 2px 2px 12px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.7);
    }

    .spacer { flex:1; min-height:280px; }

    h1 {
      font-family:'Bebas Neue',sans-serif;
      font-size:54px; line-height:0.88; color:#fff;
      text-transform:uppercase; white-space:nowrap;
      text-shadow: 2px 2px 12px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.7);
      margin-bottom:6px;
    }
    h1 span { color:#e10600; }

    .h1-sub {
      font-family:'Bebas Neue',sans-serif;
      font-size:40px; color:rgba(255,255,255,0.75);
      letter-spacing:2px; white-space:nowrap;
      text-shadow: 2px 2px 12px rgba(0,0,0,0.9);
      margin-bottom:24px;
    }

    .red-bar { width:60px; height:4px; background:#e10600; margin-bottom:24px; }

    /* Bloques explicativos */
    .facts { display:flex; flex-direction:column; gap:14px; max-width:580px; margin-bottom:28px; }

    .fact {
      display:flex; gap:14px; align-items:flex-start;
    }

    .fact-icon {
      font-size:28px; line-height:1; flex-shrink:0; margin-top:2px;
    }

    .fact-body { display:flex; flex-direction:column; gap:3px; }

    .fact-title {
      font-family:'Bebas Neue',sans-serif;
      font-size:22px; letter-spacing:1px; color:#e10600;
    }

    .fact-text {
      font-family:'Barlow',sans-serif;
      font-size:17px; font-weight:700; color:rgba(255,255,255,0.85);
      line-height:1.45;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }

    .logo { position:absolute; bottom:36px; right:40px; z-index:4; }
    .logo img { width:140px; height:auto; display:block; }
  </style>
</head>
