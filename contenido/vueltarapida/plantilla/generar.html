<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Arial Black', Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Foto de fondo */
  .bg-photo {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url('../../../refe.jpg');
    background-size: cover;
    background-position: center top;
  }

  /* Overlay degradado */
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.1) 0%,
      rgba(0,0,0,0.2) 30%,
      rgba(0,0,0,0.85) 65%,
      rgba(0,0,0,0.97) 100%
    );
  }

  /* Barra roja superior */
  .barra-top {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 8px;
    background: #DC0000;
    z-index: 10;
  }

  /* Contenido inferior */
  .contenido {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    padding: 0 70px 60px 70px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .etiqueta {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #DC0000;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .etiqueta::before {
    content: '';
    display: block;
    width: 30px;
    height: 3px;
    background: #DC0000;
  }

  .piloto {
    font-size: 58px;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 1px;
    line-height: 1;
  }

  .piloto span {
    color: #DC0000;
  }

  .divisor {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.2);
    margin: 8px 0;
  }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .stat-numero {
    font-size: 140px;
    font-weight: 900;
    color: #DC0000;
    line-height: 1;
    min-width: 160px;
  }

  .stat-texto {
    font-size: 30px;
    font-weight: 700;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 2px;
    line-height: 1.3;
  }

  .stat-texto span {
    color: #DC0000;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  .contexto {
    font-size: 16px;
    color: #888888;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .marca {
    font-size: 18px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .marca span {
    color: #DC0000;
  }
</style>
</head>
<body>
  <div class="bg-photo"></div>
  <div class="overlay"></div>
  <div class="barra-top"></div>

  <div class="contenido">
    <div class="etiqueta">Estadística</div>

    <div class="piloto">Franco <span>Colapinto</span></div>

    <div class="divisor"></div>

    <div class="stat-row">
      <div class="stat-numero">0</div>
      <div class="stat-texto">
        DNFs desde su llegada<br>a <span>Alpine</span>
      </div>
    </div>

    <div class="footer">
      <div class="contexto">Temporada 2025</div>
      <div class="marca">Vuelta <span>Rápida</span></div>
    </div>
  </div>

</body>
</html>
