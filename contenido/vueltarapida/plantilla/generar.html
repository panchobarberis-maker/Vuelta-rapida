<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Arial Black', Arial, sans-serif;
    overflow: hidden;
    background: #0d0d0d;
    position: relative;
  }

  /* Foto de Franco a la derecha */
  .foto {
    position: absolute;
    right: -20px;
    bottom: 0;
    height: 95%;
    width: 65%;
    background-image: url('../../../colap-1.png');
    background-size: cover;
    background-position: center top;
    mask-image: linear-gradient(to left, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%),
                linear-gradient(to top, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
    mask-composite: intersect;
    -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%),
                        linear-gradient(to top, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
    -webkit-mask-composite: source-in;
  }

  /* Partículas rojas decorativas */
  .particulas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(180,0,0,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 20%, rgba(180,0,0,0.08) 0%, transparent 50%);
  }

  /* Barra roja izquierda */
  .barra-izq {
    position: absolute;
    left: 60px;
    top: 80px;
    width: 5px;
    height: 420px;
    background: #DC0000;
  }

  /* Barra roja top */
  .barra-top {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 7px;
    background: #DC0000;
  }

  /* Logo VR arriba izquierda */
  .logo {
    position: absolute;
    top: 36px;
    left: 60px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icono {
    width: 90px;
    height: 90px;
    background-image: url('../../../PNG EN ROJO.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }

  .logo-texto {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .logo-texto .linea1 {
    font-size: 34px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .logo-texto .linea2 {
    font-size: 18px;
    font-weight: 700;
    color: #DC0000;
    letter-spacing: 8px;
    text-transform: uppercase;
  }

  /* Contenido principal izquierda */
  .contenido {
    position: absolute;
    left: 80px;
    top: 180px;
    max-width: 560px;
    z-index: 10;
  }

  .etiqueta {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #DC0000;
    margin-bottom: 24px;
  }

  .nombre {
    font-size: 72px;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    line-height: 0.9;
    margin-bottom: 32px;
  }

  .nombre .apellido {
    color: #DC0000;
    display: block;
  }

  .divisor {
    width: 80px;
    height: 4px;
    background: #DC0000;
    margin-bottom: 32px;
  }

  .stat-numero {
    font-size: 180px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1;
    margin-bottom: 8px;
    text-shadow: 4px 4px 0px #DC0000;
  }

  .stat-label {
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 2px;
    line-height: 1.3;
    max-width: 400px;
  }

  .stat-label .highlight {
    color: #DC0000;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 36px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 16px;
  }

  .temporada {
    font-size: 14px;
    color: #666;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .fuente {
    font-size: 13px;
    color: #444;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="particulas"></div>
  <div class="foto"></div>
  <div class="barra-top"></div>
  <div class="barra-izq"></div>

  <!-- Logo -->
  <div class="logo">
    <div class="logo-icono"></div>
    <div class="logo-texto">
      <span class="linea1">Vuelta Rápida</span>
      <span class="linea2">Club</span>
    </div>
  </div>

  <!-- Contenido -->
  <div class="contenido">
    <div class="etiqueta">Estadística F1</div>
    <div class="nombre">
      Franco
      <span class="apellido">Colapinto</span>
    </div>
    <div class="divisor"></div>
    <div class="stat-numero">0</div>
    <div class="stat-label">
      DNFs desde su llegada<br>a <span class="highlight">Alpine</span>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="temporada">Temporada 2025</div>
    <div class="fuente">@F1BigData</div>
  </div>

</body>
</html>
